                  )}
                  {selectedRequestForModal.type === 'Leave' && (
                    <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 text-slate-300 space-y-1">
                      <div>Form: <strong>{selectedRequestForModal.leaveDetails?.formVariant === 'COS' ? 'Contract of Service leave form' : 'CSC Form No. 6'}</strong></div>
                      <div>Leave type: <strong>{
                        selectedRequestForModal.leaveDetails?.leaveType === 'Others'
                          ? selectedRequestForModal.leaveDetails?.leaveTypeOther || 'Others'
                          : selectedRequestForModal.leaveDetails?.leaveType || selectedRequestForModal.subType
                      }</strong></div>
                      <div>Requested: <strong>{selectedRequestForModal.totalDays || '—'} working days</strong></div>
                      <div>Inclusive dates: <strong>{selectedRequestForModal.startDate || '—'} to {selectedRequestForModal.endDate || '—'}</strong></div>
                      {selectedRequestForModal.leaveDetails?.formVariant === 'COS' ? (
                        <>
                          {selectedRequestForModal.leaveDetails?.purpose && <div>Purpose: <strong>{selectedRequestForModal.leaveDetails.purpose}</strong></div>}
                          {selectedRequestForModal.leaveDetails?.relieverName && <div>Reliever: <strong>{selectedRequestForModal.leaveDetails.relieverName}</strong></div>}
                          {selectedRequestForModal.leaveDetails?.relieverDesignation && <div>Reliever designation: <strong>{selectedRequestForModal.leaveDetails.relieverDesignation}</strong></div>}
                          {selectedRequestForModal.leaveDetails?.relieverTemporaryDesignation && <div>Temporary designation: <strong>{selectedRequestForModal.leaveDetails.relieverTemporaryDesignation}</strong></div>}
                        </>
                      ) : (
                        <div>Commutation: <strong>{selectedRequestForModal.leaveDetails?.commutation || 'Not Requested'}</strong></div>
                      )}
                      {selectedRequestForModal.reason && <div>Additional remarks: {selectedRequestForModal.reason}</div>}
                    </div>
                  )}
                  {selectedRequestForModal.extraOffDate && <div>Extra Off Date: <strong>{selectedRequestForModal.extraOffDate}</strong></div>}
                  {selectedRequestForModal.type !== 'Leave' && (
                    <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 text-slate-300">
                      Reason: {selectedRequestForModal.reason}
                    </div>
                  )}
                  <div className="pt-2 border-t border-slate-800 space-y-1">
                    {selectedRequestForModal.type === 'Exchange of Duty' && (
                      <div>Covering Employee: <strong>{getReviewStatus(selectedRequestForModal, 'Covering Employee')}</strong></div>
                    )}
                    {['Department Head', 'Human Resource', 'Administrative Officer V', 'Chief of Hospital'].map(role => (
                      <div key={role}>{role}: <strong>{getReviewStatus(selectedRequestForModal, role)}</strong></div>
                    ))}
                  </div>
                  {selectedRequestForModal.logDate && <div>Log Date: {selectedRequestForModal.logDate} ({selectedRequestForModal.timeIn} – {selectedRequestForModal.timeOut})</div>}
                  {selectedRequestForModal.extraOffDate && <div>Extra Off Date: {selectedRequestForModal.extraOffDate}</div>}
                  {selectedRequestForModal.attachmentId && (
                    <div><AttachmentLink req={selectedRequestForModal} /></div>
                  )}
                </div>

                <div className="pt-2 flex justify-end gap-2">
                  <button
                    type="button"
                    onClick={() => setPrintModalRequest(selectedRequestForModal)}
                    className="px-4 py-2 bg-indigo-600 text-white rounded-xl"
                  >
                    Print Request
                  </button>
                  <button onClick={() => setSelectedRequestForModal(null)} className="px-4 py-2 bg-slate-800 text-white rounded-xl">
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* PRINTABLE REQUEST FORM */}
          {printModalRequest && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center overflow-y-auto p-3 sm:p-4">
              <div
                id="printable-request-form"
                className={`bg-white text-slate-900 w-full max-w-3xl max-h-[calc(100dvh-1.5rem)] overflow-y-auto rounded-2xl p-5 sm:p-8 space-y-5 shadow-2xl ${printModalRequest.status === 'Pending Dept Head Approval' ? 'print-form-watermark' : ''}`}
              >
                <div className="print-form-header flex items-center justify-between gap-4 border-b-2 border-slate-800 pb-3">
                  <div>
                    <div className="print-form-heading text-sm font-black uppercase tracking-wide text-slate-900">Coron District Hospital</div>
                    <div className="print-form-subheading text-xs font-bold uppercase tracking-wider text-slate-600">
                      Request Slip
                    </div>
                  </div>
                  <button id="print-form-close" onClick={() => setPrintModalRequest(null)} className="text-slate-500 hover:text-black">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="print-form-summary flex flex-wrap items-start justify-between gap-3">
                  <div>
                    <div className="print-form-id text-lg font-black text-indigo-950">{printModalRequest.id}</div>
                    <div className="text-sm font-bold">{printModalRequest.subType || printModalRequest.type}</div>
                  </div>
                  <div className={`print-form-status rounded-lg border px-3 py-1.5 text-xs font-bold ${
                    printModalRequest.status === 'Approved'
                      ? 'border-emerald-700 text-emerald-800'
                      : printModalRequest.status === 'Rejected'
                        ? 'border-rose-700 text-rose-800'
                        : 'border-amber-700 text-amber-800'
                  }`}>
                    {printModalRequest.status === 'Rejected' ? 'DECLINED' : printModalRequest.status.toUpperCase()}
                  </div>
                </div>

                <div className="print-form-details grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                  {[
                    ['Applicant', printModalRequest.applicantName],
                    ['Department / Section', printModalRequest.section],
                    ['Date filed', printModalRequest.dateFiled || '—'],
                    ['Application type', printModalRequest.type],
                    ['Date of exchange', printModalRequest.type === 'Exchange of Duty' ? printModalRequest.startDate : null],
                    ['Covering employee', printModalRequest.type === 'Exchange of Duty'
                      ? employees.find(user => user.id === printModalRequest.taggedUsers?.[0])?.name || 'Unknown employee'
                      : null],
                    ['Covering employee approval', printModalRequest.type === 'Exchange of Duty' ? getReviewStatus(printModalRequest, 'Covering Employee') : null],
                    ['Leave form', printModalRequest.type === 'Leave' ? (printModalRequest.leaveDetails?.formVariant === 'COS' ? 'Contract of Service leave form' : 'CSC Form No. 6') : null],
                    ['Leave type', printModalRequest.type === 'Leave'
                      ? printModalRequest.leaveDetails?.leaveType === 'Others'
                        ? printModalRequest.leaveDetails?.leaveTypeOther || 'Others'
                        : printModalRequest.leaveDetails?.leaveType || printModalRequest.subType
                      : null],
                    ['Position', printModalRequest.type === 'Leave' ? printModalRequest.leaveDetails?.position : null],
                    ['Salary', printModalRequest.type === 'Leave' && printModalRequest.leaveDetails?.formVariant !== 'COS' ? printModalRequest.leaveDetails?.salary : null],
                    ['Start date', printModalRequest.type === 'Exchange of Duty' ? null : printModalRequest.startDate],
                    ['End date', printModalRequest.endDate],
                    ['Total days', printModalRequest.totalDays],
                    ['Commutation', printModalRequest.type === 'Leave' && printModalRequest.leaveDetails?.formVariant !== 'COS' ? printModalRequest.leaveDetails?.commutation : null],
                    ['Reliever', printModalRequest.type === 'Leave' ? printModalRequest.leaveDetails?.relieverName : null],
                    ['Reliever designation', printModalRequest.type === 'Leave' ? printModalRequest.leaveDetails?.relieverDesignation : null],
                    ['Temporary designation', printModalRequest.type === 'Leave' ? printModalRequest.leaveDetails?.relieverTemporaryDesignation : null],
                    ['Extra off date', printModalRequest.extraOffDate],
                    ['Log date', printModalRequest.logDate],
                    ['Time in', printModalRequest.timeIn],
                    ['Time out', printModalRequest.timeOut],
                    ['Supporting document', printModalRequest.attachmentName]
                  ].filter(([, value]) => value).map(([label, value]) => (
                    <div key={label} className="print-form-field rounded-lg border border-slate-300 p-2.5">
                      <span className="print-form-field-label text-slate-500">{label}</span>
                      <div className="print-form-field-value mt-0.5 font-semibold">{value}</div>
                    </div>
                  ))}
                </div>

                {(printModalRequest.type !== 'Leave' || printModalRequest.leaveDetails?.formVariant === 'COS') && (
                  <div className="print-form-purpose space-y-2 text-xs">
                    <div className="font-bold">{printModalRequest.type === 'Leave' ? 'Purpose of Leave' : 'Reason / Justification'}</div>
                    <div className="print-form-purpose-value min-h-16 whitespace-pre-wrap rounded-lg border border-slate-300 p-3">
                      {printModalRequest.type === 'Leave' ? printModalRequest.leaveDetails?.purpose || '—' : printModalRequest.reason || '—'}
                    </div>
                  </div>
                )}

                {printModalRequest.type !== 'Leave' && currentUser?.signature && (
                  <div className="print-form-applicant-signature flex items-center gap-3 rounded-lg border border-slate-300 p-3">
                    <img src={currentUser.signature} alt={`${currentUser.name}'s e-signature on file`} className="h-12 max-w-36 object-contain" />
                    <div className="text-xs">
                      <div className="font-bold">{currentUser.name}</div>
                      <div className="mt-0.5 text-slate-500">Account e-signature on file (not an approval)</div>
                    </div>
                  </div>
                )}

                <div className="print-approval-section">
                  <h4 className="print-approval-heading text-xs font-bold uppercase tracking-wide">Approval of all heads</h4>
                  <div className="print-approval-grid">
                  {[
                    { label: 'Department Head', role: 'Department Head' },
                    { label: 'Human Resource', role: 'Human Resource' },
                    { label: 'Administrative Officer V', role: 'Administrative Officer V' },
                    { label: 'Chief of Hospital', role: 'Chief of Hospital' }
                  ].map(stage => {
                    const review = getReviewRecord(printModalRequest, stage.role);
                    const reviewStatus = getReviewStatus(printModalRequest, stage.role);
                    return (
                      <div key={stage.role} className="print-approval-card">
                        <div className="print-approval-role font-bold">{stage.label}</div>
                        <div className={`print-approval-decision font-semibold ${reviewStatus === 'Rejected' ? 'text-rose-700' : reviewStatus === 'Approved' ? 'text-emerald-800' : 'text-slate-600'}`}>
                          {reviewStatus}
                        </div>
                        <div className="print-approval-signature-area">
                          {review?.signature
                            ? <img src={review.signature} alt={`${stage.label} e-signature`} className="print-approval-signature object-contain" />
                            : null}
                        </div>
                        <div className="print-approval-person break-words">
                          {review?.user || (reviewStatus === 'Approved' ? 'Approval on file' : '')}
                        </div>
                        <div className="print-approval-date text-slate-500">
                          {review?.date || (reviewStatus === 'Approved' ? printModalRequest.approvalDate || 'Approved' : '—')}
                        </div>
                      </div>
                    );
                  })}
                  </div>
                </div>

                <div id="print-form-actions" className="flex justify-end space-x-2 pt-2">
                  <button
                    type="button"
                    onClick={() => window.print()}
                    className="px-4 py-2 bg-indigo-600 text-white font-bold text-xs rounded-xl"
                  >
                    Print Request Slip
                  </button>
                  <button
                    type="button"
                    onClick={() => window.print()}
                    className="px-4 py-2 bg-emerald-700 text-white font-bold text-xs rounded-xl"
                  >
                    Save as PDF
                  </button>
                  <button type="button" onClick={() => setPrintModalRequest(null)} className="px-4 py-2 bg-slate-200 text-slate-800 font-bold text-xs rounded-xl">
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function StatusBadge({ status }) {
      if (status === 'Approved') {
        return <span className="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-950 text-emerald-400 border border-emerald-800">Approved</span>;
      }
      if (status === 'Rejected') {
        return <span className="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-rose-950 text-rose-400 border border-rose-800">Declined / Terminated</span>;
      }
      return <span className="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-950 text-amber-400 border border-amber-800">{status}</span>;
    }

    // --- INSTALL AS WEB APP (Android / iOS) ---
    function InstallPrompt() {
      const [deferred, setDeferred] = useState(null);
      const [show, setShow] = useState(false);
      const [isIOS, setIsIOS] = useState(false);

      useEffect(() => {
        const standalone = document.documentElement.classList.contains('installed-app');
        if (standalone || localStorage.getItem('codh-install-dismissed') === '1') return;

        const ua = window.navigator.userAgent;
        const ios = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (ios) { setIsIOS(true); setShow(true); }

        const onPrompt = (e) => { e.preventDefault(); setDeferred(e); setShow(true); };
        const onInstalled = () => { setShow(false); setDeferred(null); };
        window.addEventListener('beforeinstallprompt', onPrompt);
        window.addEventListener('appinstalled', onInstalled);
        return () => {
          window.removeEventListener('beforeinstallprompt', onPrompt);
          window.removeEventListener('appinstalled', onInstalled);
        };
      }, []);

      const dismiss = () => { localStorage.setItem('codh-install-dismissed', '1'); setShow(false); };
      const install = async () => {
        if (!deferred) return;
        deferred.prompt();
        await deferred.userChoice;
        setDeferred(null);
        setShow(false);
      };

      if (!show || (!isIOS && !deferred)) return null;

      return (
        <div className="fixed inset-x-3 z-[60] md:left-auto md:right-5 md:max-w-sm" style={{ bottom: 'calc(env(safe-area-inset-bottom) + 12px)' }}>
          <div className="flex items-start gap-3 p-4 rounded-2xl bg-slate-900 border border-emerald-500/60 shadow-2xl">
            <img src="/icons/icon-192.png" alt="" className="w-11 h-11 rounded-xl flex-shrink-0" />
            <div className="flex-1 min-w-0">
              <div className="text-sm font-bold text-white">Install CoDH App</div>
              {isIOS ? (
                <p className="text-xs text-slate-400 mt-1 leading-relaxed">
                  In Safari, tap the <span className="font-bold text-slate-200">Share</span> button
                  <svg viewBox="0 0 24 24" className="inline w-4 h-4 mx-1 -mt-0.5 text-emerald-400" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
                  then choose <span className="font-bold text-slate-200">Add to Home Screen</span>.
                </p>
              ) : (
                <p className="text-xs text-slate-400 mt-1">Add the app to your home screen for quick, full-screen access.</p>
              )}
              <div className="flex gap-2 mt-3">
                {!isIOS && (
                  <button onClick={install} className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-lg">Install</button>
                )}
                <button onClick={dismiss} className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs rounded-lg">{isIOS ? 'Got it' : 'Not now'}</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => console.warn('Service worker registration failed', err));
      });
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<><App /><InstallPrompt /></>);

    const launchScreen = document.getElementById('app-launch-screen');
    if (launchScreen) {
      const dismissLaunchScreen = () => {
        const startedAt = Number(launchScreen.dataset.startedAt);
        const elapsed = performance.now() - startedAt;
        window.setTimeout(() => launchScreen.classList.add('is-leaving'), Math.max(0, 5000 - elapsed));
      };
      if (document.readyState === 'complete') dismissLaunchScreen();
      else window.addEventListener('load', dismissLaunchScreen, { once: true });
    }
  </script>
</body>
</html>
