  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#047857">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-title" content="CoDH App">
  <meta name="application-name" content="CoDH App">
  <meta name="app-version" content="development">
  <script>
    (() => {
      document.documentElement.classList.add('app-launching');
      const isInstalledApp =
        window.matchMedia('(display-mode: standalone)').matches ||
        window.matchMedia('(display-mode: fullscreen)').matches ||
        window.navigator.standalone === true;
      if (isInstalledApp) document.documentElement.classList.add('installed-app');
    })();
  </script>
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

  <title>CoDH App - Integrated Request System</title>
  <style>
    html, body, #root {
      min-height: 100%;
      width: 100%;
    }

    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    #app-launch-screen {
      position: fixed;
      z-index: 10000;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 42%, #064e3b 0%, #052e2b 34%, #020617 76%);
      color: #f8fafc;
      opacity: 1;
      transition: opacity 360ms ease, visibility 360ms ease;
    }

    .app-launching #app-launch-screen {
      display: flex;
    }

    #app-launch-screen.is-leaving {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .app-launch-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      animation: app-launch-enter 700ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .app-launch-icon {
      width: 5.5rem;
      height: 5.5rem;
      border-radius: 1.5rem;
      box-shadow: 0 0 55px rgb(16 185 129 / 28%);
      animation: app-launch-pulse 1.2s ease-in-out infinite alternate;
    }

    .app-launch-title {
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .app-launch-subtitle {
      margin-top: -1rem;
      color: #a7f3d0;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .app-launch-progress {
      width: 7rem;
      height: 3px;
      overflow: hidden;
      border-radius: 9999px;
      background: rgb(255 255 255 / 16%);
    }

    .app-launch-progress::after {
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: #34d399;
      content: "";
      animation: app-launch-progress 950ms ease-in-out infinite;
    }

    @keyframes app-launch-enter {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes app-launch-pulse {
      from { transform: scale(0.96); }
      to { transform: scale(1.04); }
    }

    @keyframes app-launch-progress {
      from { transform: translateX(-110%); }
      to { transform: translateX(250%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-launch-content,
      .app-launch-icon,
      .app-launch-progress::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }

      #app-launch-screen {
        transition-duration: 0.01ms;
      }
    }

    .print-form-watermark {
      position: relative;
      isolation: isolate;
    }

    .print-form-watermark::after {
      position: absolute;
      z-index: 0;
      top: 52%;
      left: 50%;
      color: rgb(180 83 9 / 16%);
      content: "PENDING DEPT HEAD APPROVAL";
      font-size: clamp(1.25rem, 4vw, 2.5rem);
      font-weight: 900;
      letter-spacing: 0.06em;
      line-height: 1;
      pointer-events: none;
      text-align: center;
      white-space: nowrap;
      transform: translate(-50%, -50%) rotate(-24deg);
    }

    .print-form-watermark > * {
      position: relative;
      z-index: 1;
    }

    @media print {
      @page {
        size: 4.25in 5.5in;
        margin: 0.12in;
      }

        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100vh !important;
        overflow: hidden !important;

      #printable-request-form .print-approval-role {

      #printable-request-form .print-approval-signature {

        padding-top: 0.25mm !important;

        overflow-wrap: anywhere !important;
      }

      #print-form-close,
      #print-form-actions {
        display: none !important;
      }
    }

    // --- DATABASE API HELPER ---
    const api = async (path, options = {}) => {
      let res;
      try {
        res = await fetch(`/api/${path}`, {
          ...options,
          headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
          body: options.body ? JSON.stringify(options.body) : undefined,
        });
      } catch (err) {
        if (!(err instanceof TypeError)) throw err;
        throw new Error(`Could not connect to the app API at ${window.location.origin}. For local use, run "npm run dev" and open http://127.0.0.1:4173. For production, use Netlify with a configured database.`);
      }
      if (!res.headers.get('content-type')?.includes('application/json')) {
        throw new Error(`The app API at ${window.location.origin}/api/${path} returned HTTP ${res.status} instead of JSON. For local use, run "npm run dev" and open http://127.0.0.1:4173. For production, use Netlify with a configured database.`);
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Request failed.');
      return data;
    };

    const MAX_UPLOAD_BYTES = 4 * 1024 * 1024;
    const isSupportedImage = file => /\.(png|jpe?g)$/i.test(file.name);

    const uploadAttachment = async (file, userId) => {
      const res = await fetch('/api/attachments', {
        method: 'POST',
        headers: {
          'Content-Type': file.type,
          'X-File-Name': encodeURIComponent(file.name),
          'X-Uploaded-By': userId || '',
        },
        body: file,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `File upload failed (HTTP ${res.status}).`);
      return data;
    };

    const uploadProfileMedia = async (file, userId, mediaType) => {
      const res = await fetch(`/api/profile-media/${encodeURIComponent(userId)}/${mediaType}`, {
        method: 'POST',
        headers: {
          'Content-Type': file.type,
          'X-File-Name': encodeURIComponent(file.name),
        },
        body: file,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Profile image upload failed (HTTP ${res.status}).`);

    function ImageUploadField({ file, onChange, onError }) {
      const inputRef = useRef(null);
      const handle = (e) => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        if (!isSupportedImage(f)) { e.target.value = ''; return onError('Only .png, .jpg, or .jpeg image files are allowed.'); }
        if (f.size > MAX_UPLOAD_BYTES) { e.target.value = ''; return onError('File is too large. Maximum size is 4 MB.'); }
        onChange(f);
      };
      const clear = () => { if (inputRef.current) inputRef.current.value = ''; onChange(null); };
      return (
        <div>
          <label className="text-slate-300 block mb-1">Supporting Document (.png, .jpg, or .jpeg; max 4 MB)</label>
          <input
            ref={inputRef} type="file" accept=".png,.jpg,.jpeg,image/png,image/jpeg" onChange={handle}
            className="w-full text-slate-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-indigo-600 file:text-white file:font-bold hover:file:bg-indigo-500 bg-slate-950 border border-slate-800 rounded-lg px-2 py-1.5"
          />
          {file && (
            <div className="mt-2 flex items-center justify-between text-[11px] text-slate-400 bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5">
              <span className="truncate">{file.name} ({(file.size / 1024).toFixed(0)} KB)</span>
              <button type="button" onClick={clear} className="text-rose-400 hover:text-rose-300 font-bold ml-2">Remove</button>
            </div>
          )}
        </div>
      );
    }

    // Pop-up viewer for a request's attachment. Rendered in a portal so it sits above any other modal.
    function AttachmentViewer({ req, onClose }) {
      useEffect(() => {
        const onKey = e => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', onKey);
        const prevOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = prevOverflow; };
      }, [onClose]);
      const name = req.attachmentName || 'attachment image';
      return ReactDOM.createPortal(
        <div
          className="fixed inset-0 z-[100] bg-slate-950/90 flex items-center justify-center p-4"
          onClick={onClose} role="dialog" aria-modal="true" aria-label={`Attachment: ${name}`}
        >
          <div
            className="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl w-full max-w-3xl max-h-full flex flex-col text-white"
            onClick={e => e.stopPropagation()}

              <span className="text-xs font-bold text-indigo-400 truncate">{name}</span>
              <button type="button" onClick={onClose} aria-label="Close attachment" className="text-slate-400 hover:text-white shrink-0">
                <Icon name="x" className="w-5 h-5" />

            </div>
            <div className="flex-1 min-h-0 overflow-auto p-4 flex items-center justify-center bg-slate-950 rounded-b-2xl">
              <img
                src={`/api/attachments/${encodeURIComponent(req.attachmentId)}`}
                alt={name}
                className="max-w-full max-h-[75vh] object-contain rounded-lg"
              />
            </div>
            <div className="px-4 py-3 border-t border-slate-800 flex justify-end">
              <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold rounded-xl">
                Close
              </button>
            </div>
          </div>
        </div>,
        document.body

    function SelectionPicker({

    function DepartmentPicker({ value, options = HOSPITAL_DEPARTMENTS, onChange, className = '' }) {

    const getReviewRecord = (request, role) =>
      (request.logs || []).find(log =>
        (log.action?.startsWith('APPROVE by ') || log.action?.startsWith('REJECT by ')) &&
        log.action.endsWith(`(${role})`)
      );
    const getReviewStatus = (request, role) => {
      if (role === 'Covering Employee' && request.status === 'Pending Duty Swap Approval') return 'Pending';
      const decision = [...(request.logs || [])].reverse().find(log =>
        (log.action?.startsWith('APPROVE by ') || log.action?.startsWith('REJECT by ')) &&
        log.action.endsWith(`(${role})`)
      );
      if (decision) return decision.action.startsWith('APPROVE by ') ? 'Approved' : 'Rejected';
      if (role === 'Covering Employee') {
        return request.type === 'Exchange of Duty' && request.taggedUsers?.length ? 'Not started' : 'Not required';
      }
      if (role === 'Department Head') return request.deptHeadApproval || 'Pending';
      if (role === 'Human Resource') return request.hrApproval || 'Not recorded';
      if (role === 'Administrative Officer V') {
        if (['Approved', 'Pending Chief of Hospital Approval'].includes(request.finalApproval)) return 'Approved';
        return request.status === 'Pending Administrative Officer V Approval' ? 'Pending' : 'Not started';
      }
      if (role === 'Chief of Hospital') {
        if (request.finalApproval === 'Approved') return 'Approved';
        return request.status === 'Pending Chief of Hospital Approval' ? 'Pending' : 'Not started';
      }
      return 'Not started';
    };

    const isHumanResourceDepartmentHead = user =>

      'Vacation Leave w/o pay',

    const splitProfileName = user => {
      if (user?.firstName || user?.lastName || user?.middleName) {
        return {
          firstName: user.firstName || '',
          middleName: user.middleName || '',
          lastName: user.lastName || ''
        };
      }
      const name = String(user?.name || '').trim();
      if (name.includes(',')) {
        const [lastName, ...givenNames] = name.split(',');
        const [firstName = '', ...middleNames] = givenNames.join(',').trim().split(/\s+/);
        return { firstName, middleName: middleNames.join(' '), lastName: lastName.trim() };
      }
      const parts = name.split(/\s+/).filter(Boolean);
      return {
        firstName: parts[0] || '',
        middleName: parts.length > 2 ? parts.slice(1, -1).join(' ') : '',
        lastName: parts.length > 1 ? parts[parts.length - 1] : ''
      };
    };
    const createProfileForm = user => ({

    });

    function App() {
      const appVersion = document.querySelector('meta[name="app-version"]').content;
      const TETRIS_WIDTH = 10;
      const TETRIS_HEIGHT = 20;
      const TETRIS_PIECES = [
        { color: 'cyan', shape: [[1, 1, 1, 1]] },
        { color: 'blue', shape: [[1, 0, 0], [1, 1, 1]] },
        { color: 'orange', shape: [[0, 0, 1], [1, 1, 1]] },
        { color: 'yellow', shape: [[1, 1], [1, 1]] },
        { color: 'green', shape: [[0, 1, 1], [1, 1, 0]] },
        { color: 'purple', shape: [[0, 1, 0], [1, 1, 1]] },
        { color: 'red', shape: [[1, 1, 0], [0, 1, 1]] }
      ];
      const TETRIS_COLORS = {
        cyan: 'border-cyan-300 bg-cyan-400',
        blue: 'border-blue-300 bg-blue-500',
        orange: 'border-orange-300 bg-orange-500',
        yellow: 'border-yellow-200 bg-yellow-400',
        green: 'border-green-300 bg-green-500',
        purple: 'border-purple-300 bg-purple-500',
        red: 'border-red-300 bg-red-500'
      };
      const createTetrisPiece = () => {
        const definition = TETRIS_PIECES[Math.floor(Math.random() * TETRIS_PIECES.length)];
        return {
          shape: definition.shape.map(row => [...row]),
          color: definition.color,
          x: Math.floor((TETRIS_WIDTH - definition.shape[0].length) / 2),
          y: 0
        };
      };
      const createTetrisBoard = () => Array.from(
        { length: TETRIS_HEIGHT },
        () => Array(TETRIS_WIDTH).fill(null)

          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(880, now);
          volume.gain.setValueAtTime(0.001, now);
          volume.gain.exponentialRampToValueAtTime(0.16, now + 0.02);
          volume.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          oscillator.connect(volume);
          volume.connect(context.destination);
          oscillator.start(now);
          oscillator.stop(now + 0.23);

          lastName: '', firstName: '', middleName: '', position: '', employmentType: 'Contract of Service',
          email: '', role: 'Employee', dept: 'Medical Section', password: '', confirmPassword: ''
        });
        triggerToast(`Registered as ${role}. Saved to database! Pending Admin activation.`);
        setAuthMode('signin');
      };

      // --- USER MANAGEMENT CONTROLS (ADMIN ONLY) ---
      const handleDeleteUser = async (userId) => {
        try {
          await api(`users/${encodeURIComponent(userId)}`, { method: 'DELETE' });
        } catch (err) {
          return triggerToast(err.message, 'error');
        }
        setEmployees(prev => prev.filter(u => u.id !== userId));
        triggerToast('User account deleted.');
      };

      const handleToggleUserStatus = async (userId) => {
        const target = employees.find(u => u.id === userId);
        if (!target) return;
        const nextStatus = target.status === 'Pending' || target.status === 'Deactivated' ? 'Approved' : 'Deactivated';

        try {
          await api(`users/${encodeURIComponent(userId)}`, { method: 'PUT', body: { status: nextStatus } });
        } catch (err) {
          return triggerToast(err.message, 'error');
        }
        setEmployees(prev => prev.map(u => u.id === userId ? { ...u, status: nextStatus } : u));
        triggerToast(`User status set to ${nextStatus}.`);
      };

      const openProfileEditor = (user = currentUser) => {
        setProfileEditTarget(user?.id === currentUser?.id ? null : user);
        setProfileForm(createProfileForm(user));
        setProfilePhoto(null);
        setProfileSignature(null);
        setProfileSignatureCleared(false);
        setIsEditingProfile(true);
      };

      const handleProfileSignatureChange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        e.target.value = '';
        if (!isSupportedImage(file)) {
          setProfileSignature(null);
          return triggerToast('Only .png, .jpg, or .jpeg image files are allowed.', 'error');
        }
        if (file.size > MAX_UPLOAD_BYTES) {
          setProfileSignature(null);
          return triggerToast('File is too large. Maximum size is 4 MB.', 'error');
        }

        setProfileSignature(file);
        setProfileSignatureCleared(false);
      };

      const handleSaveProfile = async (e) => {
        e.preventDefault();
        if (!profileAccount) return;
        const isEditingAnotherUser = profileAccount.id !== currentUser.id;
        const canEditRole = currentUser.role === 'Admin' && Boolean(profileEditTarget);
        const firstName = profileForm.firstName.trim();
        const middleName = profileForm.middleName.trim();
        const lastName = profileForm.lastName.trim();
        const email = profileForm.email.trim();
        const dept = profileForm.dept.trim();
        if (!firstName || !lastName || !email || !dept) return triggerToast('First name, last name, email, and department are required.', 'error');
        if (!['Contract of Service', 'Permanent'].includes(profileForm.employmentType)) {
          return triggerToast('Select a valid employment type.', 'error');
        }
        if (employees.some(user => user.id !== profileAccount.id && user.email.toLowerCase() === email.toLowerCase())) {
          return triggerToast('An account with this email already exists.', 'error');
        }
        if (!isEditingAnotherUser && profileForm.newPassword && profileForm.newPassword.length !== 6) {
          return triggerToast('New password must be exactly 6 characters.', 'error');
        }
        if (!isEditingAnotherUser && profileForm.newPassword !== profileForm.confirmNewPassword) {
          return triggerToast('New passwords do not match.', 'error');
        }
        if (!isEditingAnotherUser && profileForm.newPassword && !profileForm.currentPassword) {
          return triggerToast('Enter your current password to change it.', 'error');
        }

        setSavingProfile(true);
        try {
          let avatar = profileAccount.avatar || null;
          if (profilePhoto) {
            const uploaded = await uploadProfileMedia(profilePhoto, profileAccount.id, 'avatar');
            avatar = uploaded.url;
          }
          let signature = profileSignatureCleared ? null : profileAccount.signature || null;
          if (profileSignature) {
            const uploaded = await uploadProfileMedia(profileSignature, profileAccount.id, 'signature');
            signature = uploaded.url;
          }
          const saved = await api(`users/${encodeURIComponent(profileAccount.id)}`, {
            method: 'PUT',
            body: {
              firstName,
              middleName,
              lastName,
              name: `${lastName}, ${firstName}${middleName ? ` ${middleName}` : ''}`,
              email,
              dept,
              ...(canEditRole ? { employmentType: profileForm.employmentType } : {}),
              ...(profileForm.employmentType === 'Permanent' ? {
                title: profileForm.title.trim(),
                salary: profileForm.salary
              } : {}),
              ...(canEditRole ? { role: profileForm.role, headOfDept: dept } : {}),
              ...(!canEditRole && profileAccount.role === 'Department Head' ? { headOfDept: dept } : {}),
              avatar,
              signature,
              ...(!isEditingAnotherUser && profileForm.newPassword ? {
                currentPassword: profileForm.currentPassword,
                newPassword: profileForm.newPassword
              } : {})
            }
          });
          if (saved.id === currentUser.id) setCurrentUser(prev => ({ ...prev, ...saved }));
          setEmployees(prev => prev.map(user => user.id === saved.id ? saved : user));
          setProfileForm(prev => ({ ...prev, currentPassword: '', newPassword: '', confirmNewPassword: '' }));
          setProfilePhoto(null);
          setProfileSignature(null);
          setProfileSignatureCleared(false);
          setProfileEditTarget(null);
          setIsEditingProfile(false);
          triggerToast(isEditingAnotherUser ? 'User profile was updated.' : 'Your profile was updated.');
        } catch (err) {
          triggerToast(err.message, 'error');
        } finally {
          setSavingProfile(false);
        }
      };

      const handleCloseProfileEditor = () => {
        if (savingProfile) return;
        setProfileForm(createProfileForm(profileAccount));
        setProfilePhoto(null);
        setProfileSignature(null);
        setProfileSignatureCleared(false);
        setProfileEditTarget(null);
        setIsEditingProfile(false);
      };

      const resetProfileForm = () => {
        setProfileForm(createProfileForm(profileAccount));
      };

      const notifyApprovers = async (request, role, title, message, date) => {
        const recipients = employees.filter(user =>
          user.status === 'Approved' &&
          (role === 'Human Resource' ? isHumanResourceReviewer(user) : user.role === role) &&
          (role !== 'Department Head' || (user.headOfDept || user.dept) === request.section)
        );
        if (recipients.length === 0) {
          throw new Error(role === 'Human Resource'
            ? 'No approved Human Resource reviewer account is available.'
            : `No approved ${role} account is assigned to this request.`);
        }
        const created = await Promise.all(recipients.map(user =>
          api('notifications', {
            method: 'POST',
            body: { userId: user.id, requestId: request.id, title, message, date }
          })
        ));
        setNotifications(prev => [...created, ...prev]);
      };

      const notifyDutySwapCoveringUser = async request => {
        const coveringUserId = request.taggedUsers?.[0];
        const coveringUser = employees.find(user =>
          user.id === coveringUserId && user.status === 'Approved' && user.role === 'Employee'
        );
        if (!coveringUser) throw new Error('The selected covering employee is no longer available.');
        const notification = await api('notifications', {
          method: 'POST',
          body: {
            userId: coveringUser.id,
            requestId: request.id,
            title: 'Duty swap approval required',
            message: `${request.applicantName} requested a duty swap with you for ${request.startDate}. Please accept or decline before department review.`,
            date: request.dateFiled || new Date().toLocaleString()
          }
        });
        setNotifications(prev => [notification, ...prev]);
      };

      // --- WORKFLOW APPROVAL LOGIC ---
      const handleApprovalAction = async (reqId, actionType) => {
        const timeNow = new Date().toLocaleString();
        let updatedReq = null;

        const targetReq = requests.find(r => r.id === reqId);
        if (!targetReq) return;

        let nextStatus = targetReq.status;
        let nextDeptApproval = targetReq.deptHeadApproval;
        let nextHrApproval = targetReq.hrApproval || 'Pending';
        let nextFinalApproval = targetReq.finalApproval;
        const approverRole = currentUser.role;
        const isDutySwapCoveringUser =
          currentUser.role === 'Employee' &&
          targetReq.type === 'Exchange of Duty' &&
          targetReq.status === 'Pending Duty Swap Approval' &&
          targetReq.taggedUsers?.includes(currentUser.id);
        const isAssignedDepartmentHead =
          approverRole === 'Department Head' &&
          targetReq.section === (currentUser.headOfDept || currentUser.dept);
        const isHumanResourceReview =
          isHumanResourceReviewer(currentUser) &&
          targetReq.status === 'Pending Human Resource Verification' &&
          nextHrApproval === 'Pending';
        const reviewRole = isDutySwapCoveringUser
          ? 'Covering Employee'
          : isHumanResourceReview ? 'Human Resource' : approverRole;
        const canReview =
          isDutySwapCoveringUser ||
          (isAssignedDepartmentHead && targetReq.status === 'Pending Dept Head Approval' && targetReq.deptHeadApproval === 'Pending') ||
          isHumanResourceReview ||
          (approverRole === 'Administrative Officer V' && targetReq.status === 'Pending Administrative Officer V Approval' && nextHrApproval === 'Approved' && targetReq.deptHeadApproval === 'Approved') ||
          (approverRole === 'Chief of Hospital' && targetReq.status === 'Pending Chief of Hospital Approval' && nextFinalApproval === 'Pending Chief of Hospital Approval');
        if (!canReview) return triggerToast('This request is not awaiting your approval stage.', 'error');

        if (actionType === 'REJECT') {
          nextStatus = 'Rejected';
          if (reviewRole === 'Department Head') nextDeptApproval = 'Rejected';
          else if (reviewRole === 'Human Resource') nextHrApproval = 'Rejected';
          else if (reviewRole !== 'Covering Employee') nextFinalApproval = 'Rejected';
        } else if (actionType === 'APPROVE') {
          if (reviewRole === 'Covering Employee') {
            nextStatus = 'Pending Dept Head Approval';
          } else if (reviewRole === 'Department Head') {
            nextDeptApproval = 'Approved';
            nextStatus = 'Pending Human Resource Verification';
          } else if (reviewRole === 'Human Resource') {
            nextHrApproval = 'Approved';
            nextStatus = 'Pending Administrative Officer V Approval';
          } else if (approverRole === 'Administrative Officer V') {
            nextFinalApproval = 'Pending Chief of Hospital Approval';
            nextStatus = 'Pending Chief of Hospital Approval';
          } else {
            nextFinalApproval = 'Approved';
            nextStatus = 'Approved';
          }
        }

        updatedReq = {
          ...targetReq,
          status: nextStatus,
          deptHeadApproval: nextDeptApproval,
          hrApproval: nextHrApproval,
          finalApproval: nextFinalApproval,
          approvedBy: currentUser.name,
          approvalDate: timeNow,
          logs: [...(targetReq.logs || []), {
            date: timeNow,
            action: `${actionType} by ${currentUser.name} (${reviewRole})`,
            user: currentUser.name,
            ...(actionType === 'APPROVE' ? { signature: currentUser.signature } : {})
          }]
        };

        try {
          updatedReq = await api(`requests/${encodeURIComponent(reqId)}`, { method: 'PUT', body: updatedReq });
          setRequests(prev => prev.map(r => r.id === reqId ? updatedReq : r));
        } catch (err) {
          return triggerToast(err.message, 'error');
        }

        const sideEffectErrors = [];
        try {
          const notif = await api('notifications', {
            method: 'POST',
            body: {
              userId: updatedReq.applicantId,
              requestId: updatedReq.id,
              title: 'Request Status Updated',
              message: `Your application (${updatedReq.id}) has been updated to "${updatedReq.status}" by ${currentUser.name}.`,
              date: timeNow
            }
          });
          setNotifications(prev => [notif, ...prev]);
        } catch (err) {
          sideEffectErrors.push(`Applicant notification failed: ${err.message}`);
        }

        if (actionType === 'APPROVE' && reviewRole === 'Covering Employee') {
          try {
            await notifyApprovers(
              updatedReq,
              'Department Head',
              'Approval required: Department Head',
              `Request ${updatedReq.id} has been accepted by the covering employee and is awaiting your review.`,
              timeNow
            );
          } catch (err) {
            sideEffectErrors.push(`Department Head notification failed: ${err.message}`);
          }
        } else if (actionType === 'APPROVE' && reviewRole === 'Department Head') {
          try {
            await notifyApprovers(
              updatedReq,
              'Human Resource',
              'Verification required: Human Resource',
              `Request ${updatedReq.id} has been approved by the Department Head and is awaiting Human Resource verification.`,
              timeNow
            );
          } catch (err) {
            sideEffectErrors.push(`Human Resource notification failed: ${err.message}`);
          }
        } else if (actionType === 'APPROVE' && reviewRole === 'Human Resource') {
          try {
            await notifyApprovers(
              updatedReq,
              'Administrative Officer V',
              'Approval required: Administrative Officer V',
              `Request ${updatedReq.id} has been verified by Human Resource and is awaiting your review.`,
              timeNow
            );
          } catch (err) {
            sideEffectErrors.push(`Administrative Officer V notification failed: ${err.message}`);
          }
        } else if (actionType === 'APPROVE' && approverRole === 'Administrative Officer V') {
          try {
            await notifyApprovers(
              updatedReq,
              'Chief of Hospital',
              'Approval required: Chief of Hospital',
              `Request ${updatedReq.id} has been approved by the Administrative Officer V and is awaiting your final review.`,
              timeNow
            );
          } catch (err) {
            sideEffectErrors.push(`Chief of Hospital notification failed: ${err.message}`);
          }
        }

        if (['Approved', 'Rejected'].includes(updatedReq.status)) {
          const recipients = employees.filter(user =>
            user.status === 'Approved' &&
            (user.id === updatedReq.applicantId ||
              (user.role === 'Department Head' && (user.headOfDept || user.dept) === updatedReq.section) ||
              (updatedReq.type === 'Exchange of Duty' && updatedReq.taggedUsers?.includes(user.id)) ||
              isHumanResourceReviewer(user) ||
              ['Administrative Officer V', 'Chief of Hospital'].includes(user.role))
          );
          const results = await Promise.allSettled(recipients.map(recipient =>
            api('archives', {
              method: 'POST',
              body: {
                originalReqId: updatedReq.id,
                applicantId: updatedReq.applicantId,
                recipientId: recipient.id,
                applicantName: updatedReq.applicantName,
                type: updatedReq.type,
                section: updatedReq.section,
                status: updatedReq.status,
                archivedDate: timeNow,
                reason: updatedReq.reason
              }
            })
          ));
          const copies = results.filter(result => result.status === 'fulfilled').map(result => result.value);
          setUserArchiveCopies(prev => [...copies, ...prev]);
          const failedCopies = results.filter(result => result.status === 'rejected').length;
          if (failedCopies) sideEffectErrors.push(`Saving ${failedCopies} request copy/copies failed.`);
        }

        if (['Approved', 'Rejected'].includes(updatedReq.status)) setPrintModalRequest(updatedReq);
        triggerToast(
          sideEffectErrors.length
            ? `Workflow status saved, but ${sideEffectErrors.join(' ')}`
            : 'Workflow saved to database.',
          sideEffectErrors.length ? 'error' : 'success'
        );
      };

      const handleEditRequest = (request) => {
        if (
          currentUser.role !== 'Employee' ||
          request.applicantId !== currentUser.id ||
          request.status !== 'Pending Dept Head Approval' ||
          request.deptHeadApproval !== 'Pending'
        ) return;

        setEditingRequest(request);
        setFormType(request.type);
        setFormData({
          ...EMPTY_FORM,
          subType: request.subType || EMPTY_FORM.subType,
          section: currentUser.dept || '',
          coveringUserId: request.taggedUsers?.[0] || '',
          logDate: request.logDate || '',
          timeIn: request.timeIn || '',
          timeOut: request.timeOut || '',
          startDate: request.startDate || '',
          endDate: request.endDate || '',
          totalDays: request.totalDays ?? '',
          extraOffDate: request.extraOffDate || '',
          reason: request.reason || '',
          leaveDetails: {
            ...EMPTY_LEAVE_DETAILS,
            ...(request.leaveDetails || {}),
            formVariant: request.leaveDetails?.formVariant || (currentUser.employmentType === 'Permanent' ? 'CSC' : 'COS'),
            studyPurposes: [...(request.leaveDetails?.studyPurposes || [])]
          }
        });
        setActiveTab('new-request');
      };

      const handleCancelRequestEdit = () => {
        setEditingRequest(null);
        setFormData(createEmptyForm(currentUser));
        setFormType('');
        setActiveTab('dashboard');
      };

      const updateLeaveDetails = (field, value) => {
        setFormData(prev => ({
          ...prev,
          leaveDetails: { ...prev.leaveDetails, [field]: value }
        }));
      };

      const handleFormSubmit = async (e) => {
        e.preventDefault();
        const timeNow = new Date().toLocaleString();
        if (!formType) return triggerToast('Select an application type before continuing.', 'error');
        if (formType === 'Leave' && formData.endDate < formData.startDate) {
          return triggerToast('The end date must be on or after the start date.', 'error');
        }
        if (formType === 'Leave' && leaveFormVariant === 'COS' && !String(formData.leaveDetails.purpose || '').trim()) {
          return triggerToast('Enter the purpose of leave.', 'error');
        }
        if (
          formType === 'Leave' &&
          leaveFormVariant === 'COS' &&
          formData.leaveDetails.leaveType === 'Others' &&
          !formData.leaveDetails.leaveTypeOther.trim()
        ) {
          return triggerToast('Specify the nature of leave.', 'error');
        }
        let coveringUser = null;
        if (formType === 'Exchange of Duty') {
          if (!formData.startDate) return triggerToast('Select the date of the duty exchange.', 'error');
          coveringUser = employees.find(user =>
            user.id === formData.coveringUserId &&
            user.id !== currentUser.id &&
            user.role === 'Employee' &&
            user.status === 'Approved'
          );
          if (!coveringUser) return triggerToast('Select an active employee to cover your duty.', 'error');
        }
        if (editingRequest) {
          const currentRequest = requests.find(req =>
            req.id === editingRequest.id &&
            req.applicantId === currentUser.id &&
            req.status === 'Pending Dept Head Approval' &&
            req.deptHeadApproval === 'Pending'
          );
          if (!currentRequest || currentUser.role !== 'Employee') {
            setEditingRequest(null);
            setActiveTab('dashboard');
            return triggerToast('This request can no longer be edited.', 'error');
          }
        }

        let uploaded = null;
        const leaveDetails = formType === 'Leave'
          ? {
            ...formData.leaveDetails,
            formVariant: leaveFormVariant,
            position: currentUser.title || ''
          }
          : null;
        if (formData.attachment && ['Missed Log', 'Extra Off Request'].includes(formType)) {
          try {
            uploaded = await uploadAttachment(formData.attachment, currentUser.id);
          } catch (err) {
            return triggerToast(err.message, 'error');
          }
        }

        if (editingRequest) {
          const supportsAttachment = ['Missed Log', 'Extra Off Request'].includes(formType);
          const swapNeedsCoverApproval = formType === 'Exchange of Duty' && (
            editingRequest.type !== 'Exchange of Duty' ||
            editingRequest.startDate !== formData.startDate ||
            editingRequest.taggedUsers?.[0] !== formData.coveringUserId
          );
          const updatedRequest = {
            ...editingRequest,
            type: formType,
            subType: formType === 'Leave' ? formData.leaveDetails.leaveType : formData.subType,
            section: currentUser.dept || '',
            status: swapNeedsCoverApproval ? 'Pending Duty Swap Approval' : editingRequest.status,
            logDate: formData.logDate,
            timeIn: formData.timeIn,
            timeOut: formData.timeOut,
            startDate: formData.startDate,
            endDate: formData.endDate,
            totalDays: formType === 'Leave' && formData.totalDays ? Number(formData.totalDays) : null,
            leaveDetails,
            taggedUsers: formType === 'Exchange of Duty' ? [formData.coveringUserId] : [],
            extraOffDate: formData.extraOffDate,
            reason: formData.reason,
            attachmentName: uploaded ? uploaded.fileName : supportsAttachment ? editingRequest.attachmentName || null : null,
            attachmentId: uploaded ? uploaded.id : supportsAttachment ? editingRequest.attachmentId || null : null,
            logs: [...(editingRequest.logs || []), {
              date: timeNow,
              action: `Updated by ${currentUser.name}`,
              user: currentUser.name
            }]
          };

          try {
            const saved = await api(`requests/${encodeURIComponent(editingRequest.id)}`, {
              method: 'PUT',
              body: updatedRequest
            });
            setRequests(prev => prev.map(req => req.id === saved.id ? saved : req));
            if (swapNeedsCoverApproval) {
              try {
                await notifyDutySwapCoveringUser(saved);
                triggerToast(`Request ${saved.id} updated and sent to ${coveringUser.name} for duty-swap approval.`);
              } catch (err) {
                triggerToast(`Request ${saved.id} was updated, but covering-employee notification failed: ${err.message}`, 'error');
              }
            } else {
              triggerToast(`Request ${saved.id} updated.`);
            }
            setEditingRequest(null);
            setFormData(createEmptyForm(currentUser));
            setFormType('');
            setActiveTab('dashboard');
          } catch (err) {
            triggerToast(err.message, 'error');
          }
          return;
        }

        const newReq = {
          type: formType,
          subType: formType === 'Leave' ? formData.leaveDetails.leaveType : formData.subType,
          section: currentUser.dept || '',
          status: formType === 'Exchange of Duty' ? 'Pending Duty Swap Approval' : 'Pending Dept Head Approval',
          applicantId: currentUser.id,
          applicantName: currentUser.name,
          dateFiled: timeNow,
          logDate: formData.logDate,
          timeIn: formData.timeIn,
          timeOut: formData.timeOut,
          startDate: formData.startDate,
          endDate: formData.endDate,
          totalDays: formType === 'Leave' && formData.totalDays ? Number(formData.totalDays) : null,
          leaveDetails,
          taggedUsers: formType === 'Exchange of Duty' ? [formData.coveringUserId] : [],
          extraOffDate: formData.extraOffDate,
          reason: formData.reason,
          attachmentName: uploaded ? uploaded.fileName : null,
          attachmentId: uploaded ? uploaded.id : null,
          deptHeadApproval: 'Pending',
          hrApproval: 'Pending',
          finalApproval: 'Pending',
          logs: [{ date: timeNow, action: `Submitted by ${currentUser.name}`, user: currentUser.name }]
        };

        let created;
        try {
          created = await api('requests', { method: 'POST', body: newReq });
        } catch (err) {
          return triggerToast(err.message, 'error');
        }

        setRequests(prev => [created, ...prev]);
        setFormData(createEmptyForm(currentUser));
        setFormType('');
        try {
          if (formType === 'Exchange of Duty') {
            await notifyDutySwapCoveringUser(created);
            triggerToast(`Request ${created.id} saved and sent to ${coveringUser.name} for duty-swap approval.`);
          } else {
            await notifyApprovers(
              created,
              'Department Head',
              'Approval required: Department Head',
              `New request ${created.id} is awaiting your review.`,
              timeNow
            );
            triggerToast(`Request ${created.id} saved and sent to the Department Head.`);
          }
        } catch (err) {
          triggerToast(`Request ${created.id} was saved, but approver notification failed: ${err.message}`, 'error');
        }
        setActiveTab('dashboard');
      };

      const isApprover = useMemo(() => {
        if (!currentUser) return false;
        return ['Department Head', 'Human Resource', 'Administrative Officer V', 'Chief of Hospital', 'Admin'].includes(currentUser.role) ||
          requests.some(req =>
            req.type === 'Exchange of Duty' &&
            req.status === 'Pending Duty Swap Approval' &&
            req.taggedUsers?.includes(currentUser.id)
          );
      }, [currentUser, requests]);
      const isAdminAccount = employees.some(user => user.id === currentUser?.id && user.role === 'Admin');
      const pendingUserApprovals = employees.filter(user => user.status === 'Pending');

      const visibleRequests = useMemo(() => {
        if (!currentUser) return [];
        return requests.filter((req) => {
          if (currentUser.role === 'Admin') return true;
          if (currentUser.role === 'Employee' &&
              req.applicantId !== currentUser.id &&
              !(req.type === 'Exchange of Duty' &&
                req.taggedUsers?.includes(currentUser.id))) return false;
            if (currentUser.role === 'Department Head' &&
              req.section !== (currentUser.headOfDept || currentUser.dept) &&
              !(isHumanResourceDepartmentHead(currentUser) && req.status === 'Pending Human Resource Verification')) return false;
          return true;
        });
      }, [requests, currentUser]);
      const transactionPageCount = Math.max(1, Math.ceil(visibleRequests.length / 10));
      const currentTransactionPage = Math.min(transactionPage, transactionPageCount);
      const pagedTransactions = visibleRequests.slice(
        (currentTransactionPage - 1) * 10,
        currentTransactionPage * 10,
      );

      const departmentEmployees = useMemo(() => {
        if (currentUser?.role !== 'Department Head') return [];
        const department = currentUser.headOfDept || currentUser.dept;
        if (!department) return [];
        return employees.filter(user =>
          user.role === 'Employee' && user.dept === department
        );
      }, [employees, currentUser]);

      const awaitingCurrentApproval = (req) => {
        if (
          currentUser?.role === 'Employee' &&
          req.type === 'Exchange of Duty' &&
          req.status === 'Pending Duty Swap Approval' &&
          req.taggedUsers?.includes(currentUser.id)
        ) return true;
        if (currentUser?.role === 'Department Head') {
          if (req.status === 'Pending Dept Head Approval' && req.deptHeadApproval === 'Pending' &&
              req.section === (currentUser.headOfDept || currentUser.dept)) return true;
        }
        if (isHumanResourceReviewer(currentUser)) {
          return req.status === 'Pending Human Resource Verification' && (req.hrApproval || 'Pending') === 'Pending';
        }
        if (currentUser?.role === 'Administrative Officer V') {
          return req.status === 'Pending Administrative Officer V Approval' &&
            req.deptHeadApproval === 'Approved' && req.hrApproval === 'Approved' && req.finalApproval === 'Pending';
        }
        if (currentUser?.role === 'Chief of Hospital') {
          return req.status === 'Pending Chief of Hospital Approval' && req.finalApproval === 'Pending Chief of Hospital Approval';
        }
        return false;
      };
      const requestsForApproval = visibleRequests.filter(req =>
        awaitingCurrentApproval(req) ||
        (currentUser?.role === 'Department Head' && req.deptHeadApproval === 'Approved')
      );

      const myArchivedCopies = useMemo(() => {
        if (!currentUser) return [];
        return userArchiveCopies.filter(c => (c.recipientId || c.applicantId) === currentUser.id);
      }, [userArchiveCopies, currentUser]);

      const userNotifs = useMemo(() => {
        if (!currentUser) return [];
        return notifications.filter(n => n.userId === currentUser.id);
      }, [notifications, currentUser]);

      const userUnreadNotifs = useMemo(() => {
        if (!currentUser) return [];
        return notifications.filter(n => n.userId === currentUser.id && !n.read);
      }, [notifications, currentUser]);

      const handleOpenNotification = async (notification) => {
        const requestId = notification.requestId || notification.message.match(/\((REQ-[^)]+)\)/)?.[1];
        const request = requests.find(req => req.id === requestId);
        try {
          if (!notification.read) {
            await api(`notifications/${encodeURIComponent(notification.id)}/read`, {
              method: 'POST',
              body: { userId: currentUser.id }
            });
            setNotifications(prev => prev.map(item =>
              item.id === notification.id ? { ...item, read: true } : item
            ));
          }
        } catch (err) {
          triggerToast(err.message, 'error');
          return;
        }

        setShowNotifPanel(false);
        if (request) {
          setActiveTab('dashboard');
          setSelectedRequestForModal(request);
        } else if (requestId) {
          triggerToast('The request linked to this notification could not be found.', 'error');
        }
      };

      if (!isAuthenticated) {
        return (
          <div className="min-h-screen flex items-center justify-center p-6 bg-slate-950">
            {toast && (
              <div className="fixed top-3 left-3 right-3 sm:left-auto sm:right-5 sm:max-w-sm z-50 p-4 rounded-xl bg-gradient-to-br from-blue-600/75 via-indigo-700/80 to-sky-700/75 backdrop-blur-xl border border-blue-200/40 text-white text-xs shadow-2xl">
                {toast.msg}
              </div>
            )}
            <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 space-y-6 shadow-2xl">
              <div className="text-center space-y-2">
                <div className="inline-flex p-3 rounded-2xl bg-gradient-to-br from-green-400 to-emerald-700 shadow-lg mb-1">
                  <Icon name="layers" className="w-8 h-8 text-white" />
                </div>
                <h1 className="text-2xl font-black text-white">CoDH App</h1>
                <p className="text-xs text-slate-400">Version {appVersion}</p>
                <p className="text-xs text-slate-400">Faster requests, transparent approvals, better hospital management.</p>
              </div>

              <div className="grid grid-cols-2 p-1 bg-slate-950 rounded-2xl border border-slate-800">
                <button 
                  onClick={() => setAuthMode('signin')} 
                  className={`py-2 text-xs font-bold rounded-xl transition-all ${authMode === 'signin' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}
                >
                  Sign In
                </button>
                <button 
                  onClick={() => setAuthMode('register')} 
                  className={`py-2 text-xs font-bold rounded-xl transition-all ${authMode === 'register' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}
                >
                  Register
                </button>
              </div>

              {authMode === 'signin' ? (
                <form onSubmit={handleLogin} autoComplete="off" className="space-y-4">
                  <div>
                    <label className="text-xs text-slate-300 block mb-1">Email Address</label>
                    <input 
                      type="email" required autoComplete="off" value={loginEmail} 
                      onChange={e => setLoginEmail(e.target.value)}
                      placeholder="Enter your email"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                  <div>
                    <label className="text-xs text-slate-300 block mb-1">Password</label>
                    <input 
                      type="password" required autoComplete="off" value={loginPassword} 
                      onChange={e => setLoginPassword(e.target.value)}
                      placeholder="Enter your password"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                  {IS_LOCAL_DEMO && (
                    <p className="text-center text-[10px] text-slate-500">
                      Local demo account credentials are listed in the README.
                    </p>
                  )}
                  <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-3 rounded-xl shadow-lg">
                    Log In
                  </button>
                </form>
              ) : (
                <form onSubmit={handleRegister} className="space-y-3">
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    <div>
                      <label htmlFor="register-last-name" className="text-xs text-slate-300 block mb-1">Last Name</label>
                      <input
                        id="register-last-name"
                        type="text"
                        required
                        name="lastName"
                        autoComplete="family-name"
                        placeholder="Last name"
                        value={regForm.lastName}
                        onChange={e => setRegForm(prev => ({ ...prev, lastName: e.target.value }))}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                      />
                    </div>
                    <div>
                      <label htmlFor="register-first-name" className="text-xs text-slate-300 block mb-1">First Name</label>
                      <input
                        id="register-first-name"
                        type="text"
                        required
                        name="firstName"
                        autoComplete="given-name"
                        placeholder="First name"
                        value={regForm.firstName}
                        onChange={e => setRegForm(prev => ({ ...prev, firstName: e.target.value }))}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                      />
                    </div>
                    <div>
                      <label htmlFor="register-middle-name" className="text-xs text-slate-300 block mb-1">Middle Name</label>
                      <input
                        id="register-middle-name"
                        type="text"
                        name="middleName"
                        autoComplete="additional-name"
                        placeholder="Middle name (optional)"
                        value={regForm.middleName}
                        onChange={e => setRegForm(prev => ({ ...prev, middleName: e.target.value }))}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                      />
                    </div>
                  </div>
                  <div>
                    <label htmlFor="register-position" className="text-xs text-slate-300 block mb-1">Position</label>
                    <input
                      id="register-position"
                      type="text"
                      name="position"
                      required
                      autoComplete="organization-title"
                      placeholder="Your job title or position"
                      value={regForm.position}
                      onChange={e => setRegForm(prev => ({ ...prev, position: e.target.value }))}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                    />
                  </div>
                  <div>
                    <label className="text-xs text-slate-300 block mb-1">Email Address</label>
                    <input 
                      type="email" required name="email" placeholder="user@hospital.gov.ph" value={regForm.email} 
                      onChange={e => setRegForm(prev => ({ ...prev, email: e.target.value }))}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                    />
                  </div>

                  <div>
                    <label htmlFor="register-employment-type" className="text-xs text-slate-300 block mb-1">Employment Type</label>
                    <SelectionPicker
                      id="register-employment-type"
                      name="employmentType"
                      value={regForm.employmentType}
                      onChange={employmentType => setRegForm(prev => ({ ...prev, employmentType }))}
                      options={['Contract of Service', 'Permanent']}
                      title="Select Employment Type"
                      description="Choose the employment type for this account."
                      placeholder="Select employment type"
                      className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                    />
                  </div>

                  {/* SPECIFIC ROLE SELECTION */}
                  <div>
                    <label className="text-xs text-slate-300 block mb-1">Select Assigned Role</label>
                    <SelectionPicker
                      name="role"
                      value={regForm.role}
                      onChange={role => setRegForm(prev => ({ ...prev, role }))}
                      options={['Employee', 'Department Head', 'Human Resource', 'Administrative Officer V', 'Chief of Hospital']}
                      title="Select Assigned Role"
                      description="Choose the role for this account."
                      className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                    />
                  </div>

                  {/* DEPARTMENT TAGGING ONLY FOR NON-DEPT HEAD / SPECIAL ROLES */}
                  {['Employee'].includes(regForm.role) && (
                    <div>
                      <label className="text-xs text-slate-300 block mb-1">Hospital Department / Section</label>
                      <DepartmentPicker
                        value={regForm.dept}
                        onChange={dept => setRegForm(prev => ({ ...prev, dept }))}
                        className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white"
                      />
                    </div>
                  )}

                  {regForm.role === 'Department Head' && (
                    <div className="p-2.5 bg-amber-950/40 border border-amber-500/30 rounded-xl text-[11px] text-amber-200 flex items-center space-x-2">
                      <Icon name="tag" className="w-4 h-4 text-amber-400 flex-shrink-0" />
                      <span>Note: Admin will tag your assigned hospital department upon account activation.</span>
                    </div>
                  )}

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <div className="flex justify-between items-center mb-1">
                        <label className="text-xs text-slate-300 block">Password</label>
                        <span className={`text-[10px] font-bold ${regForm.password.length === 6 ? 'text-emerald-400' : 'text-slate-400'}`}>
                          {regForm.password.length}/6
                        </span>
                      </div>
                      <input 
                        type="password" required name="password" autoComplete="new-password" maxLength="6" placeholder="6 chars" value={regForm.password} 
                        onChange={e => setRegForm(prev => ({ ...prev, password: e.target.value }))}
                        className={`w-full bg-slate-950 border rounded-xl px-3 py-2 text-xs text-white focus:outline-none ${regForm.password && regForm.password.length !== 6 ? 'border-rose-500/60' : 'border-slate-800 focus:border-indigo-500'}`}
                      />
                    </div>
                    <div>
                      <div className="flex justify-between items-center mb-1">
                        <label className="text-xs text-slate-300 block">Confirm</label>
                        <span className={`text-[10px] font-bold ${regForm.confirmPassword && regForm.confirmPassword === regForm.password && regForm.confirmPassword.length === 6 ? 'text-emerald-400' : 'text-slate-400'}`}>
                          {regForm.confirmPassword.length}/6
                        </span>
                      </div>
                      <input 
                        type="password" required name="confirmPassword" autoComplete="new-password" maxLength="6" placeholder="6 chars" value={regForm.confirmPassword} 
                        onChange={e => setRegForm(prev => ({ ...prev, confirmPassword: e.target.value }))}
                        className={`w-full bg-slate-950 border rounded-xl px-3 py-2 text-xs text-white focus:outline-none ${regForm.confirmPassword && regForm.confirmPassword !== regForm.password ? 'border-rose-500/60' : 'border-slate-800 focus:border-emerald-500'}`}
                      />
                    </div>
                  </div>
                  <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-3 rounded-xl mt-2 transition-all shadow-lg">
                    Submit Registration Request
                  </button>
                </form>
              )}
            </div>
          </div>
        );
      }

      return (
        <div className={`min-h-screen min-h-[100dvh] bg-slate-900 font-sans flex flex-col lg:flex-row ${isLightMode ? 'light-theme' : ''}`}>
          {toast && (
            <div className="fixed top-5 right-5 z-50 p-4 rounded-xl bg-gradient-to-br from-blue-600/75 via-indigo-700/80 to-sky-700/75 backdrop-blur-xl border border-blue-200/40 text-white text-xs shadow-2xl">
              {toast.msg}
            </div>
          )}

          {/* SIDEBAR */}
          <aside className="w-full lg:w-72 lg:shrink-0 sticky top-0 z-20 lg:h-screen lg:overflow-y-auto bg-slate-950/95 backdrop-blur-sm border-b lg:border-b-0 lg:border-r border-slate-800 flex flex-col">
            <div className="p-5 sm:p-6 border-b border-slate-800 flex items-center justify-between">
              <div className="flex items-center space-x-4 min-w-0">
                <div className="p-3 rounded-xl bg-gradient-to-br from-green-400 to-emerald-700 text-white">
                  <Icon name="layers" className="w-7 h-7" />
                </div>
                <div>
                  <h1 className="font-bold text-lg sm:text-xl text-white">CoDH App</h1>
                  <p className="text-xs text-slate-400">Version {appVersion}</p>
                  <p className="text-xs text-slate-400">Coron District Hospital</p>
                </div>
              </div>

              <div className="flex items-center gap-1">
                <button
                  type="button"
                  onClick={() => {
                    const nextLightMode = !isLightMode;
                    setIsLightMode(nextLightMode);
                    localStorage.setItem('codh-theme', nextLightMode ? 'light' : 'dark');
                  }}
                  aria-label={`Switch to ${isLightMode ? 'dark' : 'light'} mode`}
                  title={`Switch to ${isLightMode ? 'dark' : 'light'} mode`}
                  className="p-2.5 text-slate-400 hover:text-white rounded-xl hover:bg-slate-900 transition-all"
                >
                  <Icon name={isLightMode ? 'moon' : 'sun'} className="w-5 h-5" />
                </button>

                {/* NOTIFICATIONS BUTTON */}
                <div className="relative">
                  <button
                    type="button"
                    onClick={() => setShowNotifPanel(!showNotifPanel)}
                    aria-label="Notifications"
                    aria-expanded={showNotifPanel}
                    aria-controls="notifications-panel"
                    title="Notifications"
                    className="p-2.5 text-slate-400 hover:text-white relative rounded-xl hover:bg-slate-900 transition-all"
                  >
                    <Icon name="bell" className="w-5 h-5" />
                    {userUnreadNotifs.length > 0 && (
                      <span className="absolute top-1.5 right-1.5 w-3 h-3 bg-rose-500 rounded-full animate-pulse"></span>
                    )}
                  </button>

                  {/* NOTIFICATIONS DROPDOWN */}
                  {showNotifPanel && (
                    <div className="fixed inset-0 z-40 bg-slate-950/45 backdrop-blur-[2px]" onClick={() => setShowNotifPanel(false)}></div>
                  )}
                  {showNotifPanel && (
                    <div id="notifications-panel" className="fixed z-50 top-[4.5rem] left-3 right-3 sm:left-auto sm:right-4 sm:w-[22rem] lg:left-[19rem] lg:right-auto lg:top-6 max-h-[min(74dvh,38rem)] flex flex-col overflow-hidden rounded-2xl border border-slate-700/80 bg-slate-950/95 text-slate-100 shadow-[0_24px_80px_rgba(2,6,23,0.65)] backdrop-blur-2xl">
                      <div className="relative shrink-0 overflow-hidden border-b border-slate-700/70 bg-gradient-to-br from-emerald-500/15 via-slate-900/70 to-slate-950 px-4 py-4">
                        <div className="absolute -right-8 -top-12 h-32 w-32 rounded-full bg-emerald-400/10 blur-2xl" />
                        <div className="relative flex items-center justify-between gap-3">
                          <div className="flex min-w-0 items-center gap-3">
                            <span className="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-green-400 to-emerald-700 text-white shadow-lg shadow-emerald-950/40">
                              <Icon name="bell" className="h-5 w-5" />
                            </span>
                            <div className="min-w-0">
                              <h2 className="text-sm font-bold tracking-tight text-white">Notifications</h2>
                              <p className="mt-0.5 text-[10px] text-slate-400">Live updates every 15 seconds</p>
                            </div>
                          </div>
                          <div className="flex shrink-0 items-center gap-2">
                            <span className="rounded-full border border-emerald-400/20 bg-emerald-400/10 px-2.5 py-1 text-[10px] font-semibold text-emerald-300">
                              {userUnreadNotifs.length} unread
                            </span>
                            <button
                              type="button"
                              onClick={toggleNotificationSound}
                              aria-pressed={notificationSoundEnabled}
                              title={notificationSoundEnabled ? 'Disable notification sounds' : 'Enable notification sounds'}
                              className={`rounded-lg border px-2.5 py-1.5 text-[10px] font-semibold transition-colors ${
                                notificationSoundEnabled
                                  ? 'border-emerald-400/40 bg-emerald-400/15 text-emerald-200'
                                  : 'border-slate-700 bg-slate-900/80 text-slate-300 hover:border-slate-500'
                              }`}
                            >
                              {notificationSoundEnabled ? 'Sound on' : 'Enable sound'}
                            </button>
                          </div>
                        </div>
                      </div>
                      <div className="min-h-0 flex-1 space-y-2 overflow-y-auto overscroll-contain p-3">
                        {userNotifs.length === 0 ? (
                          <div className="flex min-h-40 flex-col items-center justify-center rounded-xl border border-dashed border-slate-700 bg-slate-900/60 px-5 text-center">
                            <span className="mb-3 flex h-11 w-11 items-center justify-center rounded-full bg-slate-800 text-slate-400">
                              <Icon name="bell" className="h-5 w-5" />
                            </span>
                            <span className="text-xs font-semibold text-slate-200">You’re all caught up</span>
                            <span className="mt-1 text-[10px] text-slate-500">New request updates will show up here.</span>
                          </div>
                        ) : (
                          userNotifs.map(n => (
                            <button
                              key={n.id}
                              type="button"
                              onClick={() => handleOpenNotification(n)}
                              className={`group w-full rounded-xl border p-3 text-left transition-colors focus:outline-none focus:ring-2 focus:ring-emerald-400/70 ${
                                n.read
                                  ? 'border-slate-800 bg-slate-900/60 hover:border-slate-700 hover:bg-slate-900'
                                  : 'border-emerald-500/25 bg-gradient-to-br from-emerald-500/[0.09] to-slate-900/90 hover:border-emerald-400/50'
                              }`}
                            >
                              <span className="flex items-start gap-2.5">
                                <span className={`mt-1.5 h-2 w-2 shrink-0 rounded-full ${n.read ? 'bg-slate-600' : 'bg-emerald-400 shadow-[0_0_10px_rgba(52,211,153,0.65)]'}`} />
                                <span className="min-w-0 flex-1">
                                  <span className="flex items-center justify-between gap-2">
                                    <span className={`truncate text-[11px] font-semibold ${n.read ? 'text-slate-300' : 'text-emerald-300'}`}>{n.title}</span>
                                    {!n.read && <span className="shrink-0 rounded-full bg-emerald-400/10 px-1.5 py-0.5 text-[9px] font-semibold text-emerald-300">NEW</span>}
                                  </span>
                                  <span className="mt-1.5 block text-[11px] leading-relaxed text-slate-400">{n.message}</span>
                                  <span className="mt-2 flex items-center justify-between gap-2">
                                    <span className="truncate text-[9px] text-slate-500">{n.date}</span>
                                    <span className="shrink-0 text-[9px] font-medium text-slate-400 transition-colors group-hover:text-emerald-300">View request →</span>
                                  </span>
                                </span>
                              </span>
                            </button>
                          ))
                        )}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>

            {/* ONLY ADMIN CAN SWITCH ROLES NOW */}
            {isAdminAccount && (
              <div className="mx-3 my-2 p-2 bg-slate-900 rounded-xl border border-slate-800">
                <button
                  type="button"
                  aria-expanded={isRoleSimulationOpen}
                  aria-controls="admin-role-options"
                  onClick={() => setIsRoleSimulationOpen(open => !open)}
                  className="w-full min-h-8 flex items-center justify-between gap-2 px-1 text-left rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >
                  <span className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Role Simulation</span>
                  <span className="flex items-center gap-2">
                    <span className="text-[10px] text-indigo-300">{currentUser.role}</span>
                    <Icon name="chevron-right" className={`w-3.5 h-3.5 text-slate-500 transition-transform ${isRoleSimulationOpen ? 'rotate-90' : ''}`} />
                  </span>
                </button>
                {isRoleSimulationOpen && (
                  <div id="admin-role-options" className="flex gap-1.5 overflow-x-auto pt-1.5">
                    {['Admin', 'Employee', 'Department Head', 'Administrative Officer V', 'Chief of Hospital'].map((r) => (
                      <button
                        key={r}
                        onClick={() => {
                          setCurrentUser({ ...currentUser, role: r });
                          triggerToast(`Simulating Role View: ${r}`);
                          setIsRoleSimulationOpen(false);
                        }}
                        className={`min-h-8 shrink-0 px-2 text-[9px] leading-tight font-medium whitespace-nowrap rounded-lg border transition-colors ${currentUser.role === r ? 'bg-indigo-600/15 border-indigo-500/40 text-indigo-300' : 'border-transparent text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}
                      >
                        {r === 'Administrative Officer V' ? 'Admin Officer V' : r}
                      </button>

                <Icon name="sliders" className="w-4 h-4" />
                <span>Dashboard</span>

              >
                <Icon name="plus" className="w-4 h-4" />
                <span>File New Request</span>
              </button>

              >
                <Icon name="archive" className="w-4 h-4" />
                <span>My Request Copies ({myArchivedCopies.length})</span>
              </button>

              {currentUser.role === 'Employee' && (
                <button
                  type="button"
                  onClick={() => handleNavigationClick('mini-games')}
                  aria-current={activeTab === 'mini-games' ? 'page' : undefined}
                  className={`w-full min-w-0 min-h-11 flex items-center space-x-2 lg:space-x-3 px-3 lg:px-4 py-2 lg:py-3 rounded-xl text-xs font-semibold leading-tight text-left ${activeTab === 'mini-games' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-900'}`}
                >
                  <Icon name="award" className="w-4 h-4" />
                  <span>Mini Games</span>
                </button>
              )}
