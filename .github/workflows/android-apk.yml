name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: codh-android-debug-keystore-v1

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
      - run: bash gradlew assembleDebug
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk CoDH-App.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Latest Android app
          make_latest: true
          prerelease: false
          overwrite_files: true
          files: CoDH-App.apk
          fail_on_unmatched_files: true
